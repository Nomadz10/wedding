<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Photo Wall · Our Wedding')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<section class="section">
    <div class="container">
        <div class="section-title">
            <p class="eyebrow">Shared by everyone</p>
            <h2>Our Photo Wall</h2>
        </div>

        <!-- Add-your-photos card with QR code -->
        <div class="card center mb" style="max-width:560px;margin:0 auto 40px;">
            <h3>Add your photos</h3>
            <p class="muted">Scan this code with your phone camera, or tap the button, to add the moments you captured.</p>
            <img th:src="@{/qr.png(size=460)}" alt="Scan to add your photos"
                 style="width:200px;height:200px;image-rendering:pixelated;margin:8px auto;display:block;">
            <a class="btn" th:href="@{/share}">&#128247; Add your photos</a>
        </div>

        <div class="photowall" th:if="${!photos.isEmpty()}">
            <div class="tile" th:each="p : ${photos}">
                <img th:src="@{'/uploads/' + ${p.filename}}"
                     th:alt="${p.uploaderName != null} ? 'Photo by ' + ${p.uploaderName} : 'Guest photo'"
                     loading="lazy">
            </div>
        </div>

        <p th:if="${photos.isEmpty()}" class="center muted">
            No photos yet &mdash; be the first to add one!
        </p>
    </div>
</section>

<!-- Click-to-enlarge lightbox -->
<div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
    <img class="lightbox-img" alt="">
</div>

<script>
    (function () {
        var lb = document.getElementById('lightbox');
        if (!lb) return;
        var img = lb.querySelector('.lightbox-img');
        var wall = document.querySelector('.photowall');
        function open(src, alt) { img.src = src; img.alt = alt || ''; lb.hidden = false; document.body.style.overflow = 'hidden'; }
        function close() { lb.hidden = true; img.removeAttribute('src'); document.body.style.overflow = ''; }
        if (wall) {
            wall.addEventListener('click', function (e) {
                var t = e.target.closest('.tile img');
                if (t) open(t.getAttribute('src'), t.getAttribute('alt'));
            });
        }
        lb.addEventListener('click', function (e) {
            if (e.target === lb || e.target.classList.contains('lightbox-close')) close();
        });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) close(); });
    })();
</script>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
