<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('Edit page')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{admin/shell :: side('pages')}"></aside>
    <main class="admin-main">
        <p><a th:href="@{/admin/pages}">&larr; Back to pages</a></p>
        <h1 th:text="${mode == 'new'} ? 'Add page' : 'Edit page'">Add page</h1>

        <form th:action="@{/admin/pages}" method="post" class="card" style="max-width:720px;">
            <input type="hidden" name="id" th:value="${page.id}">

            <div class="row">
                <div>
                    <label for="navLabel">Nav label * <span class="muted">— tab text</span></label>
                    <input type="text" id="navLabel" name="navLabel" th:value="${page.navLabel}" required placeholder="e.g. Visa">
                </div>
                <div>
                    <label for="displayOrder">Order in nav</label>
                    <input type="number" id="displayOrder" name="displayOrder" th:value="${page.displayOrder}">
                </div>
            </div>

            <label for="title">Page title *</label>
            <input type="text" id="title" name="title" th:value="${page.title}" required placeholder="e.g. Indian Visa for US Citizens">

            <label for="subtitle">Subtitle (optional)</label>
            <input type="text" id="subtitle" name="subtitle" th:value="${page.subtitle}">

            <label for="slug">URL slug <span class="muted">— leave blank to auto-generate from the nav label</span></label>
            <input type="text" id="slug" name="slug" th:value="${page.slug}" placeholder="visa">

            <label>Content <span class="muted">— use the buttons to format</span></label>
            <div class="rte-toolbar">
                <button type="button" data-cmd="formatBlock" data-val="h3" title="Heading">H</button>
                <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
                <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
                <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
                <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&#8226; List</button>
                <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
                <button type="button" data-cmd="createLink" title="Add link">&#128279; Link</button>
                <button type="button" data-cmd="outdent" title="Outdent">&#8676;</button>
                <button type="button" data-cmd="indent" title="Indent">&#8677;</button>
                <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
            </div>
            <div id="rte" class="rte" contenteditable="true" style="min-height:280px;" th:utext="${page.body}"></div>
            <input type="hidden" name="body" id="bodyHidden">

            <div class="check">
                <input type="checkbox" id="published" name="published" value="true" th:checked="${page.id == null} or ${page.published}">
                <label for="published">Show this page in the navigation</label>
            </div>

            <div class="mt">
                <button type="submit" class="btn">Save page</button>
                <a class="btn outline" th:href="@{/admin/pages}">Cancel</a>
            </div>
        </form>
    </main>
</div>

<script>
    (function () {
        var rte = document.getElementById('rte');
        var hidden = document.getElementById('bodyHidden');
        if (!rte || !hidden) return;
        try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
        document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(function (btn) {
            btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
            btn.addEventListener('click', function () {
                rte.focus();
                var cmd = btn.getAttribute('data-cmd');
                if (cmd === 'createLink') {
                    var url = prompt('Link URL (https://…)');
                    if (url) document.execCommand('createLink', false, url);
                } else {
                    document.execCommand(cmd, false, btn.getAttribute('data-val') || null);
                }
            });
        });
        rte.closest('form').addEventListener('submit', function () {
            var html = rte.innerHTML.trim();
            if (html === '<br>' || html === '<p></p>' || html === '<p><br></p>') html = '';
            hidden.value = html;
        });
    })();
</script>
</body>
</html>
