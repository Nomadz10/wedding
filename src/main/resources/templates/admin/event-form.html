<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('Edit event')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{admin/shell :: side('events')}"></aside>
    <main class="admin-main">
        <p><a th:href="@{/admin/events}">&larr; Back to events</a></p>
        <h1 th:text="${mode == 'new'} ? 'Add event' : 'Edit event'">Add event</h1>

        <form th:action="@{/admin/events}" method="post" enctype="multipart/form-data" class="card" style="max-width:640px;">
            <input type="hidden" name="id" th:value="${event.id}">

            <label for="title">Title *</label>
            <input type="text" id="title" name="title" th:value="${event.title}" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" th:text="${event.description}"></textarea>

            <div class="row">
                <div>
                    <label for="startTime">Date &amp; time</label>
                    <input type="datetime-local" id="startTime" name="startTime"
                           th:value="${event.startTime != null} ? ${#temporals.format(event.startTime, 'yyyy-MM-dd''T''HH:mm')} : ''">
                </div>
                <div>
                    <label for="displayOrder">Order on timeline</label>
                    <input type="number" id="displayOrder" name="displayOrder" th:value="${event.displayOrder}">
                </div>
            </div>

            <label for="location">Location (venue name)</label>
            <input type="text" id="location" name="location" th:value="${event.location}" placeholder="e.g. The Amaltas Fort">

            <label for="address">Address</label>
            <input type="text" id="address" name="address" th:value="${event.address}" placeholder="e.g. Hyderabad, India">

            <label for="mapUrl">Map link (clickable) <span class="muted">— paste a Google Maps link</span></label>
            <input type="text" id="mapUrl" name="mapUrl" th:value="${event.mapUrl}" placeholder="https://maps.app.goo.gl/...">

            <div class="card" style="box-shadow:none;background:#faf7f2;margin-top:18px;">
                <strong style="font-family:var(--serif);font-size:1.1rem;">Dress Code</strong>
                <div class="row" style="margin-top:8px;">
                    <div>
                        <label for="dressCodeWomen">Women</label>
                        <input type="text" id="dressCodeWomen" name="dressCodeWomen" th:value="${event.dressCodeWomen}" placeholder="e.g. Lehengas, sarees">
                    </div>
                    <div>
                        <label for="dressCodeMen">Men</label>
                        <input type="text" id="dressCodeMen" name="dressCodeMen" th:value="${event.dressCodeMen}" placeholder="e.g. Sherwanis, kurtas">
                    </div>
                </div>
                <label for="dressCode">General note (optional, shown if the two above are empty)</label>
                <input type="text" id="dressCode" name="dressCode" th:value="${event.dressCode}" placeholder="e.g. Indian festive">
            </div>

            <label for="photo">Photo <span class="muted" th:if="${event.imageFilename != null}">(a photo is already set — upload to replace)</span></label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <div th:if="${event.imageFilename != null}" class="mt">
                <img th:src="@{'/uploads/' + ${event.imageFilename}}" alt="" style="max-width:220px;border-radius:10px;">
            </div>

            <div class="mt">
                <button type="submit" class="btn">Save event</button>
                <a class="btn outline" th:href="@{/admin/events}">Cancel</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
