<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('Edit event')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{admin/shell :: side('events')}"></aside>
    <main class="admin-main">
        <p><a th:href="@{/admin/events}">&larr; Back to events</a></p>
        <h1 th:text="${mode == 'new'} ? 'Add event' : 'Edit event'">Add event</h1>

        <form th:action="@{/admin/events}" method="post" enctype="multipart/form-data" class="card" style="max-width:640px;">
            <input type="hidden" name="id" th:value="${event.id}">

            <label for="title">Title *</label>
            <input type="text" id="title" name="title" th:value="${event.title}" required>

            <label>Description <span class="muted">— use the buttons to format</span></label>
            <div class="rte-toolbar">
                <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
                <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
                <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
                <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&#8226; List</button>
                <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
                <button type="button" data-cmd="outdent" title="Outdent">&#8676;</button>
                <button type="button" data-cmd="indent" title="Indent">&#8677;</button>
                <button type="button" data-cmd="removeFormat" title="Clear formatting">Clear</button>
            </div>
            <!-- Existing text is loaded here unchanged; Enter = new paragraph, Shift+Enter = line break. -->
            <div id="rte" class="rte" contenteditable="true" th:utext="${event.description}"></div>
            <input type="hidden" name="description" id="descHidden">

            <div class="row">
                <div>
                    <label for="startTime">Date &amp; time</label>
                    <input type="datetime-local" id="startTime" name="startTime"
                           th:value="${event.startTime != null} ? ${#temporals.format(event.startTime, 'yyyy-MM-dd''T''HH:mm')} : ''">
                </div>
                <div>
                    <label for="displayOrder">Order on timeline</label>
                    <input type="number" id="displayOrder" name="displayOrder" th:value="${event.displayOrder}">
                </div>
            </div>

            <label for="location">Location (venue name)</label>
            <input type="text" id="location" name="location" th:value="${event.location}" placeholder="e.g. The Amaltas Fort">

            <label for="address">Address</label>
            <input type="text" id="address" name="address" th:value="${event.address}" placeholder="e.g. Hyderabad, India">

            <label for="mapUrl">Map link (clickable) <span class="muted">— paste a Google Maps link</span></label>
            <input type="text" id="mapUrl" name="mapUrl" th:value="${event.mapUrl}" placeholder="https://maps.app.goo.gl/...">

            <div class="card" style="box-shadow:none;background:#faf7f2;margin-top:18px;">
                <strong style="font-family:var(--serif);font-size:1.1rem;">Dress Code</strong>
                <label for="dressCode">Dress code</label>
                <input type="text" id="dressCode" name="dressCode" th:value="${event.dressCode}"
                       placeholder="e.g. Indian festive — lehengas, sarees, sherwanis">
                <label for="dressCodeWestern">Western alternatives <span class="muted">— so guests can wear what they're used to</span></label>
                <input type="text" id="dressCodeWestern" name="dressCodeWestern" th:value="${event.dressCodeWestern}"
                       placeholder="e.g. Cocktail dresses, suits">
            </div>

            <label for="photo">Photo <span class="muted" th:if="${event.imageFilename != null}">(a photo is already set — upload to replace)</span></label>
            <input type="file" id="photo" name="photo" accept="image/*">
            <div th:if="${event.imageFilename != null}" class="mt">
                <img th:src="@{'/uploads/' + ${event.imageFilename}}" alt="" style="max-width:220px;border-radius:10px;">
            </div>

            <div class="mt">
                <button type="submit" class="btn">Save event</button>
                <a class="btn outline" th:href="@{/admin/events}">Cancel</a>
            </div>
        </form>
    </main>
</div>

<script>
    (function () {
        var rte = document.getElementById('rte');
        var hidden = document.getElementById('descHidden');
        if (!rte || !hidden) return;
        try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
        document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(function (btn) {
            // keep the text selection when clicking a toolbar button
            btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
            btn.addEventListener('click', function () {
                rte.focus();
                document.execCommand(btn.getAttribute('data-cmd'), false, null);
            });
        });
        // Copy the formatted HTML into the hidden field on submit.
        rte.closest('form').addEventListener('submit', function () {
            var html = rte.innerHTML.trim();
            if (html === '<br>' || html === '<p></p>' || html === '<p><br></p>') html = '';
            hidden.value = html;
        });
    })();
</script>
</body>
</html>
