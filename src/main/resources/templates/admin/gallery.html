<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/shell :: head('Photo Wall')}"></head>
<body>
<div class="admin-shell">
    <aside th:replace="~{admin/shell :: side('gallery')}"></aside>
    <main class="admin-main">
        <h1>Guest Photo Wall</h1>
        <p class="muted">Photos guests have shared. Remove any you don't want shown.</p>

        <div th:if="${message}" class="alert success" th:text="${message}"></div>

        <div class="card mb" style="max-width:520px;">
            <h3>The QR code to display</h3>
            <p class="muted" style="font-size:.9rem;">Print this or show it on a screen at the wedding. Guests scan it to add their photos.</p>
            <img th:src="@{/qr.png(size=600)}" alt="Photo upload QR code"
                 style="width:220px;height:220px;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;">
            <p class="mt"><a class="btn small outline" th:href="@{/qr.png(size=1000)}" target="_blank">Open full-size QR (to print)</a></p>
            <p class="muted" style="font-size:.82rem;">Guests upload at: <a th:href="@{/share}" th:text="@{/share}">/share</a></p>
        </div>

        <h3>Uploaded photos (<span th:text="${#lists.size(photos)}">0</span>)</h3>
        <div class="gallery" th:if="${!photos.isEmpty()}">
            <div class="tile" th:each="p : ${photos}" style="position:relative;">
                <img th:src="@{'/uploads/' + ${p.filename}}" alt="" loading="lazy">
                <form th:action="@{'/admin/gallery/' + ${p.id} + '/delete'}" method="post"
                      style="position:absolute;top:6px;right:6px;"
                      onsubmit="return confirm('Remove this photo?');">
                    <button type="submit" class="btn small danger" style="padding:4px 10px;">&times;</button>
                </form>
                <span th:if="${p.uploaderName != null}" th:text="${p.uploaderName}"
                      style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;padding:3px 8px;"></span>
            </div>
        </div>
        <p th:if="${photos.isEmpty()}" class="muted">No photos uploaded yet.</p>
    </main>
</div>
</body>
</html>
