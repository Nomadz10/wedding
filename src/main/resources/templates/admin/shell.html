<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Admin · ' + ${title}">Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css(v=12)}">
</head>
<body>
<aside th:fragment="side(active)" class="admin-side">
    <div class="logo">Wedding Admin</div>
    <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'">Dashboard</a>
    <a th:href="@{/admin/guests}" th:classappend="${active == 'guests'} ? 'active'">Guests &amp; RSVPs</a>
    <a th:href="@{/admin/events}" th:classappend="${active == 'events'} ? 'active'">Events</a>
    <a th:href="@{/admin/gallery}" th:classappend="${active == 'gallery'} ? 'active'">Photo Wall</a>
    <a th:href="@{/}">View site &#8599;</a>
    <a th:href="@{/admin/logout}">Sign out</a>
</aside>
</body>
</html>
