<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Events · Our Wedding')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<section class="section">
    <div class="container">
        <div class="section-title">
            <p class="eyebrow">Join Us</p>
            <h2>The Celebrations</h2>
        </div>

        <!-- Horizontal by day, events stacked within each day, hover for details -->
        <div th:replace="~{fragments/layout :: timelineByDay(${days})}"></div>

        <!-- Full details listed below for easy reading / printing -->
        <div class="stack" style="max-width:720px;margin:60px auto 0;" th:if="${!events.isEmpty()}">
            <div class="card" th:each="e : ${events}">
                <div class="row" style="align-items:center;">
                    <div style="flex:2;">
                        <h3 th:text="${e.title}">Sangeet</h3>
                        <div class="tl-meta">
                            <span th:if="${e.startTime != null}"
                                  th:text="${#temporals.format(e.startTime, 'EEEE, MMMM d · h:mm a')}">Mon, Nov 23 · 7:00 PM</span>
                        </div>
                        <div class="tl-meta" th:if="${e.location != null}">
                            &#128205;
                            <a th:if="${!#strings.isEmpty(e.mapUrl)}" th:href="${e.mapUrl}" target="_blank" rel="noopener noreferrer" th:text="${e.location}">Venue</a>
                            <span th:unless="${!#strings.isEmpty(e.mapUrl)}" th:text="${e.location}">Venue</span>
                        </div>
                        <div class="tl-meta" th:if="${e.address != null}"><span th:text="${e.address}">Address</span></div>
                        <a class="maplink" th:if="${!#strings.isEmpty(e.mapUrl)}" th:href="${e.mapUrl}" target="_blank" rel="noopener noreferrer">&#128506;&#65039; View on map</a>

                        <div class="dresscode"
                             th:if="${!#strings.isEmpty(e.dressCodeWomen) or !#strings.isEmpty(e.dressCodeMen) or !#strings.isEmpty(e.dressCode)}">
                            <span class="dc-label">Dress Code</span>
                            <div th:if="${!#strings.isEmpty(e.dressCodeWomen)}"><strong>Women:</strong> <span th:text="${e.dressCodeWomen}">Lehengas, sarees</span></div>
                            <div th:if="${!#strings.isEmpty(e.dressCodeMen)}"><strong>Men:</strong> <span th:text="${e.dressCodeMen}">Sherwanis, kurtas</span></div>
                            <div th:if="${#strings.isEmpty(e.dressCodeWomen) and #strings.isEmpty(e.dressCodeMen) and !#strings.isEmpty(e.dressCode)}" th:text="${e.dressCode}">Indian festive</div>
                        </div>

                        <p th:text="${e.description}">Description</p>
                    </div>
                    <div style="flex:1;min-width:160px;" th:if="${e.imageFilename != null}">
                        <img th:src="@{'/uploads/' + ${e.imageFilename}}" alt="" style="border-radius:12px;">
                    </div>
                </div>
            </div>
        </div>

        <p class="center mt" th:if="${rsvpEnabled}">
            <a class="btn" th:href="@{/rsvp}" th:if="${rsvpOpen}">RSVP now</a>
            <span th:unless="${rsvpOpen}" class="deadline closed">RSVPs have now closed</span>
        </p>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
