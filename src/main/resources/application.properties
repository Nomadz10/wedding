# =====================================================================
# Default config = LOCAL development (H2 file DB, no setup needed).
# Production overrides live in application-prod.properties + env vars.
# Every value below can be overridden by an environment variable.
# =====================================================================

# ---- Server ----
# Railway (and most hosts) inject a PORT env var the app must bind to.
server.port=${PORT:8080}

# ---- Database ----
# Local default: H2 file DB. In production these are overridden by the
# SPRING_DATASOURCE_* environment variables (pointing at Postgres).
# Driver class is inferred from the URL, so it works for H2 and Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/weddingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console (local only; disabled in prod). http://localhost:8080/h2-console
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ---- Thymeleaf ----
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# ---- Wedding config ----
# In production these come from env vars set in the host dashboard.
wedding.admin.password=${WEDDING_ADMIN_PASSWORD:vs2026}
wedding.rsvp.deadline=${WEDDING_RSVP_DEADLINE:2026-08-20}
# Set to false to hide RSVP entirely (nav link, buttons, and /rsvp pages) until you're ready.
wedding.rsvp.enabled=${WEDDING_RSVP_ENABLED:true}

# ---- File uploads (event photos + guest photo wall) ----
# Per-file 12MB (phone photos), whole-request 80MB (guests can add several at once).
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=80MB
# In production point this at a persistent volume, e.g. /data/uploads
wedding.upload.dir=${WEDDING_UPLOAD_DIR:./uploads}

# Respect proxy headers (Railway/HTTPS) so the QR code encodes the correct public URL.
server.forward-headers-strategy=framework
