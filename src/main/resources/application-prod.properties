# =====================================================================
# Production profile. Activated by setting  SPRING_PROFILES_ACTIVE=prod
# (set this env var in Railway). Only holds prod-specific hardening;
# the database connection comes from the SPRING_DATASOURCE_* env vars.
# =====================================================================

# Turn OFF the H2 dev console in production.
spring.h2.console.enabled=false

# Cache templates in production for speed.
spring.thymeleaf.cache=true

# Keep the schema auto-updating so tables are created on first deploy.
spring.jpa.hibernate.ddl-auto=update

# Fail fast if the datasource isn't configured.
spring.datasource.hikari.connection-timeout=10000
