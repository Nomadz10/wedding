<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <g fill="none" stroke="#b08d57" stroke-width="1.4" opacity="0.5">
    <circle cx="300" cy="300" r="60"/>
    <circle cx="300" cy="300" r="120"/>
    <circle cx="300" cy="300" r="200"/>
    <circle cx="300" cy="300" r="270"/>
    <g id="petals-inner">
      <path d="M300 240 C330 270 330 300 300 330 C270 300 270 270 300 240 Z"/>
    </g>
    <g id="petals-mid">
      <path d="M300 130 C345 185 345 220 300 260 C255 220 255 185 300 130 Z"/>
    </g>
    <!-- 12 inner petals -->
    <g>
      <use href="#petals-inner" transform="rotate(0 300 300)"/>
      <use href="#petals-inner" transform="rotate(30 300 300)"/>
      <use href="#petals-inner" transform="rotate(60 300 300)"/>
      <use href="#petals-inner" transform="rotate(90 300 300)"/>
      <use href="#petals-inner" transform="rotate(120 300 300)"/>
      <use href="#petals-inner" transform="rotate(150 300 300)"/>
      <use href="#petals-inner" transform="rotate(180 300 300)"/>
      <use href="#petals-inner" transform="rotate(210 300 300)"/>
      <use href="#petals-inner" transform="rotate(240 300 300)"/>
      <use href="#petals-inner" transform="rotate(270 300 300)"/>
      <use href="#petals-inner" transform="rotate(300 300 300)"/>
      <use href="#petals-inner" transform="rotate(330 300 300)"/>
    </g>
    <!-- 16 outer petals -->
    <g>
      <use href="#petals-mid" transform="rotate(0 300 300)"/>
      <use href="#petals-mid" transform="rotate(22.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(45 300 300)"/>
      <use href="#petals-mid" transform="rotate(67.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(90 300 300)"/>
      <use href="#petals-mid" transform="rotate(112.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(135 300 300)"/>
      <use href="#petals-mid" transform="rotate(157.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(180 300 300)"/>
      <use href="#petals-mid" transform="rotate(202.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(225 300 300)"/>
      <use href="#petals-mid" transform="rotate(247.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(270 300 300)"/>
      <use href="#petals-mid" transform="rotate(292.5 300 300)"/>
      <use href="#petals-mid" transform="rotate(315 300 300)"/>
      <use href="#petals-mid" transform="rotate(337.5 300 300)"/>
    </g>
  </g>
</svg>
